apiVersion: ubichill.com/v1alpha1
kind: World
metadata:
  name: danmaku
  author:
    name: devようかん
  version: 1.0.0
spec:
  displayName: 弾幕シューティング
  description: "自機をクリックして搭乗。矢印キーで移動・自動射撃、Escapeで降りる弾幕シューティングのデモ"
  environment:
    worldSize:
      width: 800
      height: 600
    backgroundColor: "#0b1020"
  dependencies:
    - name: danmaku
      source:
        version: latest
    - name: mobile-controller
      source:
        version: latest
  initialEntities:
    - id: ship
      tags: []
      children: []
      transform:
        x: 384
        y: 464
        z: 10
        w: 32
        h: 32
        scale: 1
        rotation: 0
      components:
        - type: danmaku:player
          data:
            speed: 200
            fireRate: 8
            bulletSpeed: 360
            autoFire: true
        - id: body-collider
          type: core:collider
          data:
            shape: rect
            size: entity
            offset: { x: 0, y: 0 }
            isTrigger: false
            layer: player
            mask: [wall]
        # タッチ/ペン環境向けの仮想コントローラ。ship (danmaku:player) と同じEntityに載せることで
        # scope:'subtree' の mobile:key_down/up が届く。
        # overlay: fill = ワールドスクロールの影響を受けない、画面全体を覆う HUD レイヤー。
        # スティック(左下)/ボタン(右下)の配置は mod 側が持つので、縦/横/タブレットでも画面内に収まる。
        # 角を基準に置きたい場合は overlay: bottom-left 等を指定し、x/y をその角からの距離にする。
        - id: mobile-pad
          type: mobile-controller:controller
          overlay: fill
          transform: { x: 0, y: 0, z: 2000 }
          data:
            targetType: danmaku:player
    - id: field
      tags: []
      children: []
      transform:
        x: 0
        y: 0
        z: 5000
        scale: 1
        rotation: 0
      components:
        - type: danmaku:canvas
          data: {}
    # 見た目は danmaku:wall、衝突はHost標準の core:collider。
    # 同じEntityへ載せるため、ワールド作者はUIと物理形状を別々に差し替えられる。
    - id: wall-top
      tags: []
      children: []
      transform: { x: 60, y: 60, z: 20, w: 680, h: 28, scale: 1, rotation: 0 }
      components:
        - id: view
          type: danmaku:wall
          data: {}
        - id: collider
          type: core:collider
          data:
            shape: rect
            size: entity
            offset: { x: 0, y: 0 }
            isTrigger: false
            layer: wall
            mask: [player, bullet]
    - id: wall-bottom
      tags: []
      children: []
      transform: { x: 60, y: 512, z: 20, w: 680, h: 28, scale: 1, rotation: 0 }
      components:
        - id: view
          type: danmaku:wall
          data: {}
        - id: collider
          type: core:collider
          data:
            shape: rect
            size: entity
            offset: { x: 0, y: 0 }
            isTrigger: false
            layer: wall
            mask: [player, bullet]
    - id: wall-left
      tags: []
      children: []
      transform: { x: 60, y: 88, z: 20, w: 28, h: 424, scale: 1, rotation: 0 }
      components:
        - id: view
          type: danmaku:wall
          data: {}
        - id: collider
          type: core:collider
          data:
            shape: rect
            size: entity
            offset: { x: 0, y: 0 }
            isTrigger: false
            layer: wall
            mask: [player, bullet]
    - id: wall-right
      tags: []
      children: []
      transform: { x: 712, y: 88, z: 20, w: 28, h: 424, scale: 1, rotation: 0 }
      components:
        - id: view
          type: danmaku:wall
          data: {}
        - id: collider
          type: core:collider
          data:
            shape: rect
            size: entity
            offset: { x: 0, y: 0 }
            isTrigger: false
            layer: wall
            mask: [player, bullet]
    - id: wall-center
      tags: []
      children: []
      transform: { x: 280, y: 292, z: 20, w: 240, h: 28, scale: 1, rotation: 0 }
      components:
        - id: view
          type: danmaku:wall
          data: {}
        - id: collider
          type: core:collider
          data:
            shape: rect
            size: entity
            offset: { x: 0, y: 0 }
            isTrigger: false
            layer: wall
            mask: [player, bullet]
