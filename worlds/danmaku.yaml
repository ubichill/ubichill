apiVersion: ubichill.com/v1alpha1
kind: World
metadata:
  name: danmaku
  version: 1.0.0
spec:
  displayName: 弾幕シューティング
  description: "自機をクリックして出撃。矢印キー（スマホはスティック）で移動、Shift で低速、ショットは自動。次々に現れる敵の弾幕をよけながら撃ち落とそう。被弾すると HP が減り、0 になると撃墜されて 3 秒後に復活する。Esc で降りる。"
  thumbnail: https://ubichill.com/world-thumbnails/danmaku.png
  environment:
    worldSize:
      width: 800
      height: 600
    backgroundColor: "#0b1020"
  dependencies:
    - name: danmaku
      source:
        version: 2.0.0
    - name: mobile-controller
      source:
        version: 1.1.2
  requires:
    protocol: 7
  initialEntities:
    - id: ship
      tags: []
      children: []
      transform:
        x: 384
        y: 500
        z: 10
        w: 32
        h: 32
        scale: 1
        rotation: 0
      components:
        - type: danmaku:player
          data:
            speed: 220
            fireRate: 10
            bulletSpeed: 480
            autoFire: true
            maxHp: 5
            invincibleSeconds: 2
            respawnSeconds: 3
            hitRadius: 4
        # タッチ/ペン環境向けの仮想コントローラ。target で操作する Entity（ここでは ship 自身）を指す。
        # 別の Entity に置いても、target が ship を指していれば mobile:key_down/up は届く。
        # overlay: fill = ワールドスクロールの影響を受けない、画面全体を覆う HUD レイヤー。
        # スティック(左下)/ボタン(右下)の配置は mod 側が持つので、縦/横/タブレットでも画面内に収まる。
        # 角を基準に置きたい場合は overlay: bottom-left 等を指定し、x/y をその角からの距離にする。
        - id: mobile-pad
          type: mobile-controller:controller
          overlay: fill
          transform: { x: 0, y: 0, z: 2000 }
          data:
            target: ship
    # 遊ぶ範囲。この矩形が壁の代わりになり、自機はここから出られない。
    # 中に置いた danmaku:enemy が、ラウンドの開始からの秒（appearAt / leaveAt）どおりに現れて撃つ。
    - id: field
      tags: []
      children: []
      transform:
        x: 0
        y: 0
        z: 5000
        w: 800
        h: 600
        scale: 1
        rotation: 0
      components:
        - type: danmaku:canvas
          data: {}
    # 敵。Entity の位置が定位置、大きさが当たりの大きさ。だんだん弾幕が濃くなり、最後にボスが出る。
    - id: enemy-scout-left
      tags: []
      children: []
      transform: { x: 180, y: 90, z: 20, w: 40, h: 40, scale: 1, rotation: 0 }
      components:
        - type: danmaku:enemy
          data:
            hp: 10
            appearAt: 2
            leaveAt: 20
            motion: sway
            range: 60
            period: 5
            pattern: aimed
            count: 3
            interval: 1.4
            bulletSpeed: 170
            spread: 24
            color: "#f472b6"
