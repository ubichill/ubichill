kind: World
spec:
  capacity:
    max: 20
    default: 10
  displayName: Ubichill Home
  description: "Ubichill公式のホームワールド"
  environment:
    worldSize:
      width: 2000
      height: 1500
    backgroundColor: "#F0F8FF"
  dependencies:
    - name: pen
      source:
        version: latest
  initialEntities:
    # 画面固定のペン置き場。overlay を付けると transform が画面座標(左上からの距離)になり、
    # ワールドをどこまでスクロールしても・スマホの狭い画面でも必ず手元に残る。
    # 親のトレイと子のペンすべてに同じ overlay を指定して、座標系を揃える必要がある
    # (子 Entity の座標は親からの相対で、flatten 時に親原点と合成されるため)。
    - id: pentray
      tags: []
      children:
        - id: pen
          tags: []
          children: []
          transform:
            h: 48
            w: 55
            x: 9
            y: 7
            z: 6
            scale: 1
            rotation: 0
          components:
            - data:
                color: "#93bcf0"
                strokeWidth: 4
              type: pen:pen
              overlay: top-left
        - id: pen2
          tags: []
          children: []
          transform:
            h: 57
            w: 57
            x: 76
            y: 6
            z: 6
            scale: 1
            rotation: 0
          components:
            - data:
                color: "#1a1a1a"
                strokeWidth: 4
              type: pen:pen
              overlay: top-left
      transform:
        h: 67
        w: 266
        x: 16
        y: 16
        z: 4
        scale: 1
        rotation: 0
      components:
        - data: {}
          type: pen:tray
          overlay: top-left
    - id: pen-canvas
      tags: []
      children: []
      transform:
        x: 530
        y: 49
        z: 60
        scale: 1
        rotation: 0
      components:
        - data: {}
          type: pen:canvas
    # 2 つ目のペン置き場。1 つ目の下に並べて置く。
    # 重要: pen:tray:release は scope:'world' で全ペンへ配信され、タップされたトレイの x/y が
    # そのままペンの transform になる。アンカー(overlay の値)はペン側の設定が使われるため、
    # ワールド座標と画面座標を混ぜたり、別々の角を基準にしたりすると、系をまたいだ瞬間に
    # ペンが全く違う場所へ飛ぶ。同じワールドのペンとトレイは overlay の値まで揃える。
    - id: pentray2
      tags: []
      children:
        - id: pen-copy
          tags: []
          children: []
          transform:
            h: 48
            w: 55
            x: 9
            y: 14
            z: 6
            scale: 1
            rotation: 0
          components:
            - data:
                color: "#93bcf0"
                strokeWidth: 4
              type: pen:pen
              overlay: top-left
        - id: pen-copy-2
          tags: []
          children: []
          transform:
            h: 48
            w: 55
            x: 64
            y: 14
            z: 6
            scale: 1
            rotation: 0
          components:
            - data:
                color: "#44474b"
                strokeWidth: 4
              type: pen:pen
              overlay: top-left
      transform:
        h: 75
        w: 175
        x: 16
        y: 96
        z: 7
        scale: 1
        rotation: 0
      components:
        - data: {}
          type: pen:tray
          overlay: top-left
metadata:
  name: default
  author:
    name: devようかん
  version: 1.0.0
apiVersion: ubichill.com/v1alpha1
