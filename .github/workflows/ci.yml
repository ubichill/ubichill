name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".gitignore"
  pull_request:
    # labeled: `preview` ラベル付与で PR プレビュー用イメージビルドを走らせる
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Node 20 は GitHub Actions runner 上で deprecate された (2026-09-16 削除予定)。
# 各 actions は Node 24 対応版へ更新済み (docker/* は v4/v7、pnpm は v6、setup-node は v5 等)。
# 念のため workflow レベルでも JS actions を Node 24 に強制しておく (保険)。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # changeset status が「main からどこで分岐したか」を見るのに履歴が必要
          # （既定のshallow checkoutだとPRブランチの単一commitしか無く
          # "Failed to find where HEAD diverged from main" で落ちる）。
          fetch-depth: 0

      # actions/checkout はチェックアウト対象ブランチのみの制限付き fetch refspec を張るため、
      # fetch-depth: 0 だけでは origin/main という参照自体が作られない
      # （実測: refspec が `+refs/heads/<このブランチ>:refs/remotes/origin/<このブランチ>` に
      # 制限されており、他ブランチは一切フェッチされない）。明示的に origin/main を取得する。
      - name: Fetch main for changeset diff base
        run: git fetch origin main:refs/remotes/origin/main

      - name: Extract Node version from package.json
        id: versions
        run: |
          echo "node=$(jq -r '.volta.node' package.json)" >> $GITHUB_OUTPUT

      # pnpm version は package.json の packageManager フィールドから自動検出
      # (action-setup v4 は version 入力と packageManager の二重指定をエラーにする)
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # .changeset/*.md のフロントマターが実ワークスペースのpackage.json名と一致するかを
      # PR時点で検証する。ここを飛ばすと不一致は push to main 後の changeset-release/main
      # ジョブでのみ発覚し、リリースフローがブロックされるまで気づけない
      # （実際に発生: "ubichill" と書いてしまい実パッケージ名 "@ubichill/sdk" と不一致）。
      # --since=origin/main で明示する: ローカルに "main" ブランチが無くても
      # (このジョブではPRブランチしかcheckoutしていない) origin/main の参照だけで解決できる。
      - name: Validate changesets
        run: npx changeset status --since=origin/main

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Extract Node version from package.json
        id: versions
        run: |
          echo "node=$(jq -r '.volta.node' package.json)" >> $GITHUB_OUTPUT

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # vitest 自体は resolve.alias で shared/ecs/sdk/ui-renderer/loader をソースへ直結するため
      # 通常は build 不要。ただし SDK のビルド系テスト（build.test.mjs 等）は esbuild 経由で
      # @ubichill/shared を node_modules → dist で解決するため、shared/dist は事前に必要。
      - name: Build shared
        run: pnpm --filter @ubichill/shared build

      - name: Test
        run: pnpm exec vitest run

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Extract Node version from package.json
        id: versions
        run: |
          echo "node=$(jq -r '.volta.node' package.json)" >> $GITHUB_OUTPUT

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # typecheck はパッケージ間参照が dist 経由のため、shared/db は事前ビルドが要る。
      # それ以外は `pnpm -r --parallel exec` で全パッケージの `tsc --noEmit` を並列実行する。
      - name: Build shared & db
        run: |
          pnpm --filter @ubichill/shared build
          pnpm --filter @ubichill/db build

      - name: Typecheck
        run: pnpm -r --parallel exec tsc --noEmit

  verify-mods:
    name: Verify mods & npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Extract Node version from package.json
        id: versions
        run: |
          echo "node=$(jq -r '.volta.node' package.json)" >> $GITHUB_OUTPUT

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build:workers / build:sdk は CLI を plain node で実行し @ubichill/shared を
      # dist 経由で import するため、shared を先にビルドする。
      - name: Build shared
        run: pnpm --filter @ubichill/shared build

      # 実際に mod をビルドし、lock.json の integrity が生成バイト列と一致するか検証する。
      # worlds/*.lock.json（mod 完全性ロック、pnpm-lock.yaml と同じくコミット対象）もここで
      # 自動再生成される（build:workers の最終ステップ）。
      - name: Build mod workers
        run: pnpm build:workers

      - name: Verify mod locks
        run: pnpm verify:mod-locks

      # 再生成した worlds/*.lock.json がコミット済みの内容と一致するか（= コミットし忘れが無いか）
      # を git diff で検証する。frozen-lockfile チェックと同じパターン。
      - name: Verify world locks are committed
        run: |
          if ! git diff --exit-code -- worlds/; then
            echo "::error::worlds/*.lock.json が古いままコミットされています。'pnpm build:workers' を実行し、再生成された worlds/*.lock.json をコミットしてください。"
            exit 1
          fi

      # `pnpm build:sdk` が生成する npm 公開物（ubichill パッケージ）が実際にインストール・
      # 実行可能かを確認する fail-closed ゲート。
      - name: Build npm publish package
        run: pnpm build:sdk

      - name: Smoke-test npm publish package
        run: |
          cd packages/sdk/dist-npm
          npm install --no-save
          node -e "import('./index.js').then(m => { if (!m.UbiSDK) throw new Error('UbiSDK not exported'); })"
          node cli.js verify --dist-dir=../../../dist/mods

  verify-sdk:
    name: Verify SDK types & drift
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          # check-drift.mjs が直近publishタグ(ubichill@*)をworktreeでビルド・比較するため、
          # タグと履歴が必要（デフォルトのshallow checkoutでは見えない）。
          fetch-depth: 0
          fetch-tags: true

      - name: Extract Node version from package.json
        id: versions
        run: |
          echo "node=$(jq -r '.volta.node' package.json)" >> $GITHUB_OUTPUT

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # buildDts は @ubichill/shared を dist 経由で解決するため shared を先にビルド。
      - name: Build shared
        run: pnpm --filter @ubichill/shared build

      # SDK型定義バンドルの検証（buildDts = TS Compiler API フルコンパイル、実測20秒級）。
      - name: Verify SDK type bundle
        run: pnpm verify:sdk-types

      # sdk がインライン展開する shared/ecs/loader を変更して sdk 向け changeset を
      # 付け忘れた場合の fail-closed 検査。
      - name: Check for undetected SDK build drift
        run: node packages/sdk/check-drift.mjs

  # 変更検知: PR 時はパスフィルタ、push to main では全て true を返す。
  detect-changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.backend }}
      frontend: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.frontend }}
      next-version: ${{ steps.next-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: next-version
        if: github.event_name == 'push'
        run: |
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            NEXT="v0.0.1"
          else
            IFS='.' read -r major minor patch <<< "${LATEST#v}"
            NEXT="v${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=${NEXT}" >> $GITHUB_OUTPUT

      # ── 変更検知 ───────────────────────────────────────────────
      # 実装は .github/scripts/detect-changed-paths.sh を参照。
      # opened / reopened: PR base から cumulative、synchronize: 前回 push HEAD から incremental
      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        env:
          PR_ACTION: ${{ github.event.action }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/detect-changed-paths.sh

  # ── Docker ビルド（並列）────────────────────────────────────────────────
  # push to main       → 変更のあったイメージを :latest / :sha-<sha> / :<version> で
  # PR + preview ラベル → 3イメージ全部を :pr-<番号> / :sha-<sha> でビルド
  #   （プレビュー環境はフルスタックが要るため detect-changes で絞らず全部作る）
  # ラベル無しの PR      → ビルドしない（lint / typecheck のみ）
  #   いずれも immutable な :sha-<sha> を付与。共有の可変 :dev タグは廃止し、
  #   デプロイ（PR ごとの環境など）は GitOps 側がこれらのタグを参照する。

  build-backend:
    name: Build and push Backend image
    # verify-mods / verify-sdk は SDK npm 公開物の検証であり、Docker イメージには不要。
    # これらを待たずに lint/test/typecheck 通過後すぐイメージビルドを開始する（並列化）。
    needs: [lint, test, typecheck, detect-changes]
    if: >
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (
        (github.event_name == 'push' && needs.detect-changes.outputs.backend == 'true') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview'))
      )
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ubichill-backend

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Extract versions
        id: versions
        run: |
          echo "node=$(jq -r '.volta.node' package.json)" >> $GITHUB_OUTPUT
          echo "pnpm=$(jq -r '.volta.pnpm' package.json)" >> $GITHUB_OUTPUT
          SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          echo "short-sha=$(echo "$SHA" | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "next-version=${{ needs.detect-changes.outputs.next-version }}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: backend-runner
          push: true
          build-args: |
            NODE_VERSION=${{ steps.versions.outputs.node }}
            PNPM_VERSION=${{ steps.versions.outputs.pnpm }}
            COMMIT_HASH=${{ steps.versions.outputs.short-sha }}
          tags: |
            ${{ github.event_name == 'push' && format('{0}/{1}/{2}:latest', env.REGISTRY, github.repository_owner, env.IMAGE_NAME) || '' }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:sha-${{ steps.versions.outputs.short-sha }}
            ${{ github.event_name == 'pull_request' && format('{0}/{1}/{2}:sha-{3}', env.REGISTRY, github.repository_owner, env.IMAGE_NAME, github.event.pull_request.head.sha) || '' }}
            ${{ github.event_name == 'pull_request' && format('{0}/{1}/{2}:pr-{3}', env.REGISTRY, github.repository_owner, env.IMAGE_NAME, github.event.pull_request.number) || '' }}
            ${{ github.event_name == 'push' && format('{0}/{1}/{2}:{3}', env.REGISTRY, github.repository_owner, env.IMAGE_NAME, steps.versions.outputs.next-version) || '' }}
          cache-from: type=gha
          provenance: false

  build-frontend:
    name: Build and push Frontend image
    needs: [lint, test, typecheck, detect-changes]
    if: >
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (
        (github.event_name == 'push' && needs.detect-changes.outputs.frontend == 'true') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview'))
      )
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ubichill-frontend

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Extract versions
        id: versions
        run: |
          echo "node=$(jq -r '.volta.node' package.json)" >> $GITHUB_OUTPUT
          echo "pnpm=$(jq -r '.volta.pnpm' package.json)" >> $GITHUB_OUTPUT
          SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          echo "short-sha=$(echo "$SHA" | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "next-version=${{ needs.detect-changes.outputs.next-version }}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: frontend-runner
          push: true
          build-args: |
            NODE_VERSION=${{ steps.versions.outputs.node }}
            PNPM_VERSION=${{ steps.versions.outputs.pnpm }}
            COMMIT_HASH=${{ steps.versions.outputs.short-sha }}
            VITE_COMMIT_HASH=${{ steps.versions.outputs.short-sha }}
            VITE_ENVIRONMENT=${{ github.event_name == 'push' && 'production' || 'development' }}
          tags: |
            ${{ github.event_name == 'push' && format('{0}/{1}/{2}:latest', env.REGISTRY, github.repository_owner, env.IMAGE_NAME) || '' }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:sha-${{ steps.versions.outputs.short-sha }}
            ${{ github.event_name == 'pull_request' && format('{0}/{1}/{2}:sha-{3}', env.REGISTRY, github.repository_owner, env.IMAGE_NAME, github.event.pull_request.head.sha) || '' }}
            ${{ github.event_name == 'pull_request' && format('{0}/{1}/{2}:pr-{3}', env.REGISTRY, github.repository_owner, env.IMAGE_NAME, github.event.pull_request.number) || '' }}
            ${{ github.event_name == 'push' && format('{0}/{1}/{2}:{3}', env.REGISTRY, github.repository_owner, env.IMAGE_NAME, steps.versions.outputs.next-version) || '' }}
          cache-from: type=gha
          provenance: false

  # ── git タグ付け（push to main のビルド完了後）──────────────────────────────

  tag-release:
    name: Tag release
    # push to main のリリースタグは SDK 検証（verify-mods/verify-sdk）も通過してから打つ。
    needs: [detect-changes, build-backend, build-frontend, verify-mods, verify-sdk]
    if: >
      always() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.build-backend.result    != 'failure' &&
      needs.build-frontend.result   != 'failure' &&
      needs.verify-mods.result      != 'failure' &&
      needs.verify-sdk.result       != 'failure' &&
      (
        needs.build-backend.result    == 'success' ||
        needs.build-frontend.result   == 'success'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.detect-changes.outputs.next-version }}
          git push origin ${{ needs.detect-changes.outputs.next-version }}
