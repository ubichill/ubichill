name: Publish Mods to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - 'packages/sdk/cli/**'
      - '.github/workflows/mods-pages.yml'
  workflow_dispatch:

concurrency:
  group: gh-pages-mods
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          install-args: --ignore-scripts

      # packages/sdk/cli/build.ts は capability 検出テーブルを @ubichill/shared から import するため、
      # ビルド済み dist が先に無いと解決に失敗する。
      - name: Build shared package
        run: pnpm turbo build --filter=@ubichill/shared

      - name: Build mod workers
        # dist/mods/ に各modのバンドルが出力される
        run: pnpm build:workers

      # 公開前の fail-closed ゲート: lock.json の integrity が実際に配布するバイト列と
      # 一致するか独立に再計算して突き合わせる。ズレていれば公開を止める。
      - name: Verify mod locks
        run: pnpm verify:mod-locks

      - name: Checkout gh-pages branch (worktree)
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          git worktree add /tmp/gh-pages gh-pages 2>/dev/null || {
            git worktree add --detach /tmp/gh-pages
            cd /tmp/gh-pages
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          }

      - name: Sync mods to gh-pages
        run: |
          # dist/mods/ を gh-pages の mods/ ディレクトリにコピー
          # Helm charts インデックスは charts/ に別途配置されるため競合しない
          mkdir -p /tmp/gh-pages/mods
          cp -r dist/mods/. /tmp/gh-pages/mods/
          echo "✅ Mods synced to gh-pages/mods/"
          ls -la /tmp/gh-pages/mods/

      # Host は作者署名（v<版>/lock.sig.json）を確認できた mod だけを実行する。外部のワールドはこの Pages の mod を
      # 参照するので、ここにも公式アカウント（ubichill@ubichill.com）で署名する（イメージ同梱の mod・公式ワールドと同じ Secret）。
      # 公開済みの過去の版も含めて署名する（過去の版を固定しているワールドでも動くように）。中身は変えないので、ワールドの lock はそのまま使える。
      - name: Sign mods
        env:
          UBICHILL_CREDENTIALS: ${{ secrets.UBICHILL_CREDENTIALS }}
        run: |
          if [ -z "$UBICHILL_CREDENTIALS" ]; then
            echo "::error::Secret UBICHILL_CREDENTIALS がありません。公式アカウントで 'ubichill ci create' を実行して設定してください。"
            exit 1
          fi
          # 公開環境が取り消されていたら、署名しても Host で作者を確認できないので先に止める
          node packages/sdk/cli/index.ts whoami
          node packages/sdk/cli/index.ts publish /tmp/gh-pages/mods
          node packages/sdk/cli/index.ts verify --dist-dir=/tmp/gh-pages/mods --require-signatures

      - name: Commit and push to gh-pages
        working-directory: /tmp/gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mods/
          if git diff --cached --quiet; then
            echo "No changes to mods, skipping commit"
          else
            git commit -m "chore(mods): modバンドルを更新 (${GITHUB_SHA::7})"
            git push origin HEAD:gh-pages --force
            echo "✅ Mods published to GitHub Pages"
          fi
