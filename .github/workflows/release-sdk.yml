name: Release ubichill (npm)

# 既存の CI の "Tag release" ジョブ（push to main で v0.0.N を自動採番するDocker imageの
# バージョニング）とは完全に独立している。ubichill（npm）のバージョンは
# packages/sdk/package.json の version のみが真実源で、Changesets が管理する。
#
# 運用: PRに `.changeset/*.md`（`pnpm changeset` で対話的に作成）を含めてmainにマージすると、
# このワークフローが「Version Packages」PR（version bump + CHANGELOG.md 更新）を自動で開く。
# そのPRをマージすると（=これ以上 .changeset/*.md が無い状態でmainにpushされると）、
# このワークフローが `pnpm build:sdk` でdist-npmを再生成し、`changeset publish` で
# npm registry へ公開する（packages/sdk の publishConfig.directory=dist-npm を参照）。
on:
  push:
    branches: [main]
    paths:
      - '.changeset/**'
      - 'packages/sdk/**'
      - 'packages/ecs/**'
      - 'packages/shared/**'
      - 'packages/loader/**'
  workflow_dispatch: {}

concurrency:
  group: release-sdk
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract Node version from package.json
        id: versions
        run: echo "node=$(jq -r '.volta.node' package.json)" >> $GITHUB_OUTPUT

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # sdk が実行時に inline する ecs/shared の最新ソースを確実に見る（型検証のため）。
      - name: Build shared package
        run: pnpm --filter @ubichill/shared build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # Version Packages PR が既に無い状態（＝マージ済み）のときだけ実行される。
          # dist-npm を最新のバージョンで再生成してから、publishConfig.directory 経由で
          # そこから publish する（packages/sdk/package.json の name はワークスペース内部名
          # "@ubichill/sdk" のままだが、dist-npm/package.json は build.mjs が "ubichill" に
          # 書き換える。publish 対象は publishConfig.directory 側なので実際に registry へ
          # 出るのは "ubichill" という名前）。
          publish: pnpm build:sdk && pnpm changeset publish
          version: pnpm changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
