name: Build Backend image

on:
  workflow_call:
    inputs:
      next-version:
        required: true
        type: string
    secrets:
      UBICHILL_CREDENTIALS:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ubichill-backend

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Extract versions
        id: versions
        run: |
          SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          echo "short-sha=$(echo "$SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "next-version=${{ inputs.next-version }}" >> "$GITHUB_OUTPUT"

      # 公式ワールドに公式アカウント（ubichill@ubichill.com）で署名し、イメージに同梱する（main だけ。マージ = 公式としての確認）。
      # 署名はリポジトリに置かない。CI 用の公開環境は公式アカウントで `ubichill ci create` して Secret UBICHILL_CREDENTIALS に入れる。
      # ほかの作者のリポジトリも同じ方法で公開できる（docs/worlds/FORMAT.md）。プレビューは署名しない（公式ワールドは ubichill.com だけが配る）。
      - uses: ./.github/actions/setup
        if: github.event_name == 'push'

      - name: Sign official worlds
        if: github.event_name == 'push'
        env:
          UBICHILL_CREDENTIALS: ${{ secrets.UBICHILL_CREDENTIALS }}
        run: |
          if [ -z "$UBICHILL_CREDENTIALS" ]; then
            echo "::error::Secret UBICHILL_CREDENTIALS がありません。公式アカウントで 'ubichill ci create --name=\"GitHub Actions: ubichill/ubichill\"' を実行して設定してください。"
            exit 1
          fi
          pnpm turbo build --filter=@ubichill/shared
          # 公開環境が取り消されていたら、署名しても配信先で作者が付かないので先に止める
          node packages/sdk/cli/index.ts whoami
          node packages/sdk/cli/index.ts publish worlds/*.yaml --out=worlds --no-install

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: backend-runner
          push: true
          build-args: |
            COMMIT_HASH=${{ steps.versions.outputs.short-sha }}
          tags: |
            ${{ github.event_name == 'push' && format('{0}/{1}/{2}:latest', env.REGISTRY, github.repository_owner, env.IMAGE_NAME) || '' }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:sha-${{ steps.versions.outputs.short-sha }}
            ${{ github.event_name == 'pull_request' && format('{0}/{1}/{2}:sha-{3}', env.REGISTRY, github.repository_owner, env.IMAGE_NAME, github.event.pull_request.head.sha) || '' }}
            ${{ github.event_name == 'pull_request' && format('{0}/{1}/{2}:pr-{3}', env.REGISTRY, github.repository_owner, env.IMAGE_NAME, github.event.pull_request.number) || '' }}
            ${{ github.event_name == 'push' && format('{0}/{1}/{2}:{3}', env.REGISTRY, github.repository_owner, env.IMAGE_NAME, steps.versions.outputs.next-version) || '' }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: false
