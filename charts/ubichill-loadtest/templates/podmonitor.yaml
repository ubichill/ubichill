{{- if .Values.podMonitor.enabled }}
{{- /* Prometheus Operator（kube-prometheus-stack）の CRD が要る。無いクラスタでは podMonitor.enabled=false */}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "ubichill-loadtest.fullname" . }}
  labels:
    {{- include "ubichill-loadtest.labels" . | nindent 4 }}
    {{- with .Values.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "ubichill-loadtest.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.podMonitor.interval }}
{{- end }}
