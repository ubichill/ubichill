{{- $scenario := .Values.scenario -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ubichill-loadtest.fullname" . }}
  labels:
    {{- include "ubichill-loadtest.labels" . | nindent 4 }}
spec:
  parallelism: {{ .Values.workers }}
  completions: {{ .Values.workers }}
  backoffLimit: {{ .Values.job.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "ubichill-loadtest.selectorLabels" . | nindent 8 }}
        ubichill.com/loadtest-scenario: {{ $scenario.name | quote }}
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: {{ .Values.job.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- /* --set で渡した "true" は bool になるので文字列に戻す（nodeSelector の値は文字列） */}}
        {{- range $key, $value := . }}
        {{ $key }}: {{ $value | toString | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: loadgen
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "/loadgen/loadgen.mjs"]
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOADTEST_INSTANCE_URL
              value: {{ .Values.target.instanceUrl | quote }}
            - name: LOADTEST_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.target.adminTokenSecret.name | quote }}
                  key: {{ .Values.target.adminTokenSecret.key | quote }}
            - name: LOADTEST_SCENARIO
              value: {{ $scenario.name | quote }}
            - name: LOADTEST_ROOMS_PER_WORKER
              value: {{ $scenario.roomsPerWorker | quote }}
            - name: LOADTEST_USERS_PER_ROOM
              value: {{ $scenario.usersPerRoom | quote }}
            - name: LOADTEST_MAX_USERS_PER_ROOM
              value: {{ $scenario.maxUsersPerRoom | quote }}
            - name: LOADTEST_CURSOR_HZ
              value: {{ $scenario.cursorHz | quote }}
            - name: LOADTEST_ACTIVE_RATIO
              value: {{ $scenario.activeRatio | quote }}
            - name: LOADTEST_DURATION_SECONDS
              value: {{ $scenario.durationSeconds | quote }}
            - name: LOADTEST_RAMP_SECONDS
              value: {{ $scenario.rampSeconds | quote }}
            - name: LOADTEST_PATCH_INTERVAL_SECONDS
              value: {{ $scenario.patchIntervalSeconds | quote }}
            - name: LOADTEST_HOLD_SECONDS
              value: {{ $scenario.holdSeconds | quote }}
            - name: LOADTEST_ROOM_PREFIX
              value: {{ $scenario.roomPrefix | quote }}
            - name: LOADTEST_METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: loadgen
              mountPath: /loadgen
              readOnly: true
      volumes:
        - name: loadgen
          configMap:
            name: {{ include "ubichill-loadtest.fullname" . }}
