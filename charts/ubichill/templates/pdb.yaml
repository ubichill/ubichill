{{- if .Values.podDisruptionBudget.enabled }}
{{- /* 実効の台数が 1 だと minAvailable: 1 で許容停止が 0 になり、drain やノード更新がそのノードで止まる。2 台以上のときだけ作る */}}
{{- $backendReplicas := ternary .Values.backend.autoscaling.minReplicas .Values.backend.replicaCount .Values.backend.autoscaling.enabled | int }}
{{- $frontendReplicas := ternary .Values.frontend.autoscaling.minReplicas .Values.frontend.replicaCount .Values.frontend.autoscaling.enabled | int }}
{{- if and .Values.backend.enabled (ge $backendReplicas 2) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ubichill.fullname" . }}-backend
  labels:
    {{- include "ubichill.labels" . | nindent 4 }}
    component: backend
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "ubichill.selectorLabels" . | nindent 6 }}
      component: backend
---
{{- end }}
{{- if and .Values.frontend.enabled (ge $frontendReplicas 2) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ubichill.fullname" . }}-frontend
  labels:
    {{- include "ubichill.labels" . | nindent 4 }}
    component: frontend
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "ubichill.selectorLabels" . | nindent 6 }}
      component: frontend
{{- end }}
{{- end }}