{{- if .Values.instanceRuntime.enabled }}
{{- $directory := .Values.instanceRuntime.directory | default "memory" }}
{{- if not (has $directory (list "memory" "redis")) }}
{{- fail (printf "instanceRuntime.directory は memory か redis です（%s）" $directory) }}
{{- end }}
{{- if and (eq $directory "redis") (not .Values.redis.enabled) (not (and .Values.redis.external .Values.redis.external.url)) }}
{{- fail "instanceRuntime.directory: redis には Redis（redis.enabled か redis.external.url）が要ります" }}
{{- end }}
{{- $replicas := 1 }}
{{- if hasKey .Values.instanceRuntime "replicas" }}
{{- $replicas = int .Values.instanceRuntime.replicas }}
{{- end }}
{{- /* メモリの Directory は Pod ごとに別なので、2 Pod 以上では同じ部屋の owner が Pod ごとにできてしまう */}}
{{- if and (ge $replicas 2) (ne $directory "redis") }}
{{- fail (printf "instanceRuntime.replicas を 2 以上（%d）にするには instanceRuntime.directory: redis が要ります（memory では Pod の間で部屋を共有できません）" $replicas) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ubichill.fullname" . }}-instance
  labels:
    {{- include "ubichill.labels" . | nindent 4 }}
spec:
  # 部屋ごとの owner は Directory が決め、別の Pod に来た WebSocket は owner へ中継する（Ingress・Service はそのまま）
  {{- /* KEDA（HPA）が台数を持つときは書かない。書くと同期のたびに HPA の決めた台数を戻してしまう */}}
  {{- if not .Values.instanceRuntime.autoscaling.enabled }}
  replicas: {{ $replicas }}
  {{- end }}
  {{- /*
    memory は Pod ごとに Directory が別なので、新旧の Pod が並ぶと同じ部屋の owner が 2 つできる。Recreate で必ず入れ替える。
    redis は owner が 1 つに決まる（fencing）ので、新しい Pod が ready になってから古い Pod を 1 つずつ draining で止める。
  */}}
  strategy:
    {{- if eq $directory "redis" }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "ubichill.selectorLabels" . | nindent 6 }}
      component: instance
  template:
    metadata:
      labels:
        {{- include "ubichill.selectorLabels" . | nindent 8 }}
        component: instance
      {{- /*
        backend の設定・イメージには依存させない。Go は状態をメモリに持つので、
        backend のデプロイや設定変更のたびに再起動すると全インスタンスの状態が消える。
        管理トークンを chart が管理する場合（existingSecret 無し）だけ、その値の変更で再起動する。
      */}}
      {{- if not (.Values.instanceRuntime.existingSecret | default .Values.backend.existingSecret) }}
      annotations:
        checksum/admin-token: {{ get .Values.backend.secretEnv .Values.instanceRuntime.secretKey | toString | sha256sum }}
      {{- end }}
    spec:
      # SIGTERM のあと drainTimeout まで接続が抜けるのを待ち、残りを閉じてから HTTP を止める（最大 10 秒）
      terminationGracePeriodSeconds: {{ .Values.instanceRuntime.terminationGracePeriodSeconds }}
      containers:
        - name: instance
          image: {{ include "ubichill.instance.image" . }}
          imagePullPolicy: {{ .Values.instanceRuntime.image.pullPolicy | default .Values.global.imagePullPolicy }}
          args:
            - --origins={{ include "ubichill.instance.origins" . }}
            - --disconnect-grace={{ .Values.instanceRuntime.disconnectGrace }}
            - --max-rooms={{ .Values.instanceRuntime.maxRooms }}
            {{- /* memory（1 Pod・Recreate）では部屋を移せる先が無く、待つほど止まっている時間が延びるだけなので待たない */}}
            - --drain-timeout={{ if eq $directory "redis" }}{{ .Values.instanceRuntime.drainTimeout }}{{ else }}0s{{ end }}
          ports:
            - name: realtime
              containerPort: 3002
          env:
            - name: INSTANCE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.instanceRuntime.existingSecret | default .Values.backend.existingSecret | default (printf "%s-backend-secrets" (include "ubichill.fullname" .)) }}
                  key: {{ .Values.instanceRuntime.secretKey }}
            # ノード ID（Pod 名＋起動ごとの乱数）と、Directory に書く自分のアドレス
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # 部屋の割り当てを Redis で共有するか（memory / redis）。replicas を 2 以上にするときだけ redis
            - name: INSTANCE_DIRECTORY
              value: {{ $directory | quote }}
            {{- with include "ubichill.redis.env" . }}
            {{- . | nindent 12 }}
            {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # draining（SIGTERM のあと）は /ready が 503 になり、Service から外れる。生存は /health のまま
          readinessProbe:
            httpGet:
              path: /ready
              port: realtime
          livenessProbe:
            httpGet:
              path: /health
              port: realtime
          resources:
            {{- toYaml .Values.instanceRuntime.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ubichill.fullname" . }}-instance
  labels:
    {{- include "ubichill.labels" . | nindent 4 }}
    component: instance
spec:
  ports:
    - name: realtime
      port: 3002
      targetPort: realtime
  selector:
    {{- include "ubichill.selectorLabels" . | nindent 4 }}
    component: instance
{{- end }}
