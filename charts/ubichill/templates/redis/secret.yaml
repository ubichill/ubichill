{{- if and .Values.redis.enabled .Values.redis.auth.enabled (not .Values.redis.auth.existingSecret) }}
{{- /* 乱数で作ると、lookup できない描画（Argo CD）では同期のたびにパスワードが変わり、backend・instance が繋がらなくなる */}}
{{- if not .Values.redis.auth.password }}
{{- fail "redis.auth.password か redis.auth.existingSecret を指定してください（認証なしにするなら redis.auth.enabled: false）" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ubichill.redis.fullname" . }}
  labels:
    {{- include "ubichill.labels" . | nindent 4 }}
    component: redis
type: Opaque
data:
  redis-password: {{ .Values.redis.auth.password | toString | b64enc | quote }}
{{- end }}
