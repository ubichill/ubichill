apiVersion: v2
name: ubichill
description: Ubichill Main Application - Frontend and Backend Platform
type: application
version: 0.2.0
appVersion: "latest"

keywords:
  - ubichill
  - platform
  - frontend
  - backend
  - mods

maintainers:
  - name: Ubichill Team
    email: pnasimonan@gmail.com

# Redis（Valkey）は templates/redis で chart 自身が動かす。PostgreSQL だけ subchart
dependencies:
  - name: postgresql
    version: "16.4.3"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
