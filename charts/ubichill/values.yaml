# Default values for ubichill main application

# Global settings
global:
  # ⚠ ここを設定すると bitnami subchart (postgresql) にも leak し、
  # docker.io/bitnamilegacy/* に対して `<global>/docker.io/...` のような壊れた URL を作る。
  # ubichill 自身の image は backend.image.repository / frontend.image.repository に
  # フルパス (ghcr.io/<owner>/...) を書く方針なので、global は空のまま。
  imageRegistry: ""
  imagePullPolicy: Always
  # デプロイ時に必須。helm install 時に --set global.domain=example.com で指定する。
  # CORS_ORIGIN / BETTER_AUTH_URL / Ingress host はここから自動導出される。
  domain: ""
  compatibility:
    openshift:
      adaptSecurityContext: auto
  security:
    allowInsecureImages: true

# Worlds configuration
# ワールド
# イメージにバンドルした worlds/ は、作者がこのサーバーのアカウントのものだけ配る（ubichill.com なら公式ワールド）。
# ほかのサーバーのワールドは URL で解決・入室する。一覧に出すには公式アカウントでそのサーバーを連合でフォローする
# （例: ubichill.com 以外のインスタンスは https://ubichill.com をフォローすると公式ワールドが出る）。
# 初期のフォロー先は backend.env の WORLDS_FEDERATION_PEERS（カンマ区切り）でも入れられる（DB を作り直すプレビュー向け）。
worlds:
  # 外部の private リポジトリ等から on-demand 取得する際の GitHub トークン（Secret として注入）
  # 本番では registryToken 直書きより existingTokenSecret を推奨
  registryToken: ""
  # 既存の Secret を使う場合（key: token が必要）。設定すると registryToken の Secret 生成をスキップ
  existingTokenSecret: ""

# Backend application configuration
backend:
  enabled: true
  # 2 以上にするには Redis（redis.enabled か redis.external.url）が要る（無いと描画で失敗する）。
  # DB 側の作業（created_at の timestamptz 化・仮登録の DB 化）が入るまでは 1 のままにする（README の「backend の複数レプリカ」）。
  replicaCount: 1

  # Drizzle migration は backend Deployment の init container として実行される（デフォルト）。
  # この Job hook は廃止予定。後方互換のため残しているが enabled: false がデフォルト。
  migrate:
    enabled: false
    backoffLimit: 2
    ttlSecondsAfterFinished: 300
    # resources を省略すると backend.resources を使う

  image:
    # 公式 ubichill org のイメージ。fork した場合は --set で上書きする。
    repository: "ghcr.io/ubichill/ubichill-backend"
    tag: "latest"
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 3001
    targetPort: 3001
  
  # Resource management
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  
  # Auto-scaling configuration
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    
    # Scaling behavior
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 50
            periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
          - type: Pods
            value: 2
            periodSeconds: 15
        selectPolicy: Max
  
  # Health checks
  healthcheck:
    enabled: true
    path: "/health"
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  
  # Environment variables (非機密)
  # ConfigMap (backend-config) に展開され envFrom で注入される。
  #
  # 自動導出される値:
  #   CORS_ORIGIN, BETTER_AUTH_URL ← global.domain から組み立て (上書き可)
  #   REDIS_URL / REDIS_PASSWORD   ← redis（subchart か redis.external）から組み立て。instance にも同じ値を渡す
  #   WORLDS_DIR                   ← /worlds-rw 固定
  #
  # よく使う option (string で渡す。zod の transform が boolean に変換する):
  #   SKIP_EMAIL_VERIFICATION: "true"   # OTP/メール送信を skip して直接登録 (dev 用)
  #   TRUST_PROXY: "true"               # Ingress 経由で X-Forwarded-* を信用 (rate limit IP 正確化)
  #   DEBUG: "true"                     # logger.debug を有効化
  #   NODE_ENV: "development"           # OTP コードをログに出す等
  #   MAIL_FROM: "Ubichill <noreply@your-domain.example>"  # 認証メールの送信元 (Resend で検証済みのドメイン)。未設定なら resend.dev サンドボックス送信元
  env:
    NODE_ENV: "production"
    PORT: "3001"
    # Database / Redis / WORLDS_* は ConfigMap 側で自動導出する

  # Secret environment variables (rendered as Secret)
  # 必須シークレット — values の上書き or existingSecret を必ず指定すること。
  # 空文字 / "replace-*" のような placeholder は template 側で fail-fast する。
  secretEnv:
    BETTER_AUTH_SECRET: ""
    RESEND_API_KEY: ""
    # 公式アカウント（ID ubichill。公式ワールドの作者とこのサーバーの管理者を兼ねる）のパスワード。
    # この値が常に正で、起動のたびにアカウントのパスワードを合わせる（画面からは変更できない）。
    # 変更はこの値を差し替えて再デプロイする（値が変わると既存のログインは無効になる）。空なら作らない（警告のみ）。
    # 強いランダム値にし、リポジトリにはコミットしない（existingSecret を推奨）。
    # ログイン用メールは backend.env.OFFICIAL_ACCOUNT_EMAIL（既定 ubichill@ubichill.com）。
    OFFICIAL_ACCOUNT_PASSWORD: ""
    # サービストークン（mod が外部サービスへ渡す身元証明）の署名鍵。Ed25519 の PKCS8（PEM か base64）。
    # 作り方: openssl genpkey -algorithm ed25519。全 Pod で同じ鍵を使う。空なら本番では発行しない（docs/SERVICE_TOKEN.md）。
    SERVICE_TOKEN_SIGNING_KEY: ""
  
  # Existing secret containing the secrets (skips secretEnv creation and injects it)
  existingSecret: ""

  # Pod-level security context (fsGroup でマウントされた emptyDir をグループ書き込み可能にする)
  podSecurityContext:
    fsGroup: 1000

  # Container-level security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

# Frontend application configuration
frontend:
  enabled: true
  replicaCount: 1
  
  image:
    # 公式 ubichill org のイメージ。fork した場合は --set で上書きする。
    repository: "ghcr.io/ubichill/ubichill-frontend"
    tag: "latest"
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  
  # Resource management
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  # Auto-scaling configuration
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  
  # Health checks
  healthcheck:
    enabled: true
    path: "/"
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  
  # Environment variables
  # nginx コンテナが使う環境変数のみ記述する。
  # BACKEND_HOST / BACKEND_PORT は deployment.yaml テンプレートで自動注入されるため不要。
  env: {}

  # Pod-level security context
  podSecurityContext:
    fsGroup: 101

  # Container-level security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

# backend と instance の共有状態。REDIS_URL / REDIS_PASSWORD を両方に渡す（README の「Redis」）
# 同梱の Redis。Bitnami の subchart ではなく chart 自身のテンプレートで Valkey（Redis 7.2 互換）を動かす（templates/redis）。
# 中身はすべて一時的（部屋の割り当て・リース・在席・レート制限・Pub/Sub）で、消えても Go が部屋を作り直す。
# Bitnami の subchart の key のうち、ここに無いもの（architecture・commonConfiguration など）は無視される（README の「Redis」）。
redis:
  enabled: true
  image:
    repository: docker.io/valkey/valkey
    # 版を固定する（latest は描画で失敗する）。digest（sha256:...）を指定するとそれで引く
    tag: "8.1.11-alpine"
    digest: ""
    pullPolicy: IfNotPresent
  auth:
    enabled: true
    # password か existingSecret のどちらかが要る（無いと描画で失敗する）。GitOps では existingSecret にする
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: ""
  # 同梱の Redis を使わず外部の Redis を使うとき（redis.enabled: false にする）。backend と instance の両方に渡す
  external:
    url: ""
    existingSecret: ""
    existingSecretPasswordKey: "redis-password"
  config:
    # 空なら master.resources.limits.memory の 75%（AOF の書き直しの fork・Pub/Sub のバッファの分を空ける）
    maxmemory: ""
    # 追い出さず、満杯なら書き込みを失敗させる。リースや部屋の割り当てを追い出すと、期限より前に別の Pod が
    # owner を取れてしまい fencing の前提（期限までは旧 owner だけ）が崩れる。失敗は「Redis が使えない」と同じ扱いになる
    maxmemoryPolicy: noeviction
    appendfsync: everysec
    # valkey.conf に足す行
    extra: ""
  master:
    service:
      ports:
        redis: 6379
    persistence:
      # AOF を PVC に置く（再起動の前後で部屋を保つため）。false なら emptyDir（Pod を作り直すと消える）
      enabled: true
      # 空ならクラスタの既定。"-" なら storageClassName: ""
      storageClass: ""
      size: 2Gi
      accessModes: [ReadWriteOnce]
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 100m
    podSecurityContext:
      # イメージの valkey ユーザー（uid 999・gid 1000）
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    nodeSelector: {}
    affinity: {}
    tolerations: []
  # redis_exporter を sidecar で動かす（Valkey にも対応する作者の公式イメージ）
  metrics:
    enabled: false
    image:
      repository: docker.io/oliver006/redis_exporter
      tag: "v1.96.0"
      digest: ""
      pullPolicy: IfNotPresent
    resources:
      limits:
        memory: 64Mi
        cpu: 100m
      requests:
        memory: 32Mi
        cpu: 10m
    serviceMonitor:
      # Prometheus Operator の CRD が要る
      enabled: false
      interval: 30s
      labels: {}
  # backend・instance の Pod からだけ 6379 に繋げる（metrics は metricsFrom、空なら同じ namespace から）
  networkPolicy:
    enabled: false
    metricsFrom: []

# Database (optional)
postgresql:
  enabled: true  # Enable if using PostgreSQL
  global:
    imageRegistry: ""
  # bitnamilegacy には PG18 タグが存在しない (legacy snapshot 時点で PG18 未リリース)。
  # `bitnami/postgresql:latest` は purge 対象外で残っているため、prod と同じく
  # latest 追従とする。
  # 注意: latest は将来 PG19+ にローリングする可能性あり。
  # バージョン固定したければ bitnamilegacy/postgresql:17.6.0-debian-12-r4 が legacy 最新
  # (ただし PG17 < 既存 PG18 PVC は読めないため PVC 再作成が必要)。
  image:
    registry: docker.io
    repository: bitnami/postgresql
    tag: latest
  auth:
    enablePostgresUser: true
    # postgresPassword: 管理者 (postgres) ユーザーのパスワード。マイグレーション/管理用。
    # password: アプリ用ユーザー (auth.username) のパスワード。**DATABASE_URL はこちらを使う**。
    # 既定で空にしておき、template 側で fail-fast。"password" のような placeholder は禁止。
    postgresPassword: ""
    username: "ubichill"
    password: ""
    existingSecret: ""
    database: "ubichill"
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      limits:
        memory: 1Gi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 100m

# Ingress configuration
ingress:
  enabled: true
  # Cloudflare Ingress Controller を使う場合は該当クラス名を設定する
  # 例: kubectl get ingressclass で確認
  className: ""
  annotations: {}
  # hosts: []  # 未設定時は global.domain から自動生成
  # tls: []    # 未設定時は global.domain から自動生成
  # /realtime → instance は hosts を手書きする場合も自動追加される

# Service configuration
service:
  # Frontend service
  frontend:
    type: ClusterIP
    port: 3000
    annotations: {}
  
  # Backend service  
  backend:
    type: ClusterIP
    port: 3001
    annotations: {}

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Node affinity (optional - for multi-AZ deployment)
nodeAffinity:
  enabled: false
  # 有効時: 配置したいゾーン名をクラスタに合わせて指定する（例: ap-northeast-1a, ap-northeast-1c）
  preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      preference:
        matchExpressions:
        - key: topology.kubernetes.io/zone
          operator: In
          values: []

# Tolerations (optional)
tolerations: []

# Node selector (optional)
nodeSelector: {}

# Monitoring and observability
monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s

# 独立したGoインスタンス実行サーバー。既定は 1 replica（複数にするときは directory: redis）。
instanceRuntime:
  enabled: true
  # backend とは別イメージ。backend のデプロイで Go が再起動しない（状態はメモリのみ）。
  image:
    repository: "ghcr.io/ubichill/ubichill-instance"
    tag: "latest"
    pullPolicy: Always
  # 受け付けるブラウザ Origin。空なら https://<global.domain>
  origins: []
  # 切断後に参加者とロックを保持する時間（Go の duration 形式）
  disconnectGrace: 15s
  # 部屋の割り当て（Directory）を Redis で共有するか: memory / redis。
  # 1 Pod では共有する相手がおらず、Redis の可用性が部屋の可用性の上限になるだけなので memory にしておく。
  # replicas を 2 以上にするときに redis にする（Redis の Secret を固定してから。README の「Redis」）。
  directory: memory
  # Go の Pod の数。2 以上は directory: redis のときだけ（memory では描画で失敗する）。
  # 部屋は割り当てた Pod が持ち、別の Pod に来た WebSocket は owner の Pod へ中継する。
  replicas: 1
  # 1 Pod が持つ部屋の数の上限。backend は redis のとき、上限に達していない Pod から新しい部屋の置き場所を選ぶ。
  maxRooms: 1000
  # 1 Pod が持つ WebSocket（部屋の参加者＋他の Pod へ中継している接続）の上限。0 なら無制限。
  # 上限の 9 割から新しい部屋を受けず（backend は別の Pod に置く）、上限で新しい参加者の入室を断る（入室中の人は切らない）。
  # 値の決め方は README の「Go インスタンスの自動スケール」。autoscaling の targetConnectionsPerPod は 9 割未満にする。
  maxConnections: 0
  # SIGTERM のあと新しい部屋を断り（draining）、この Pod に直接繋いでいるクライアントが抜けるのを待つ上限
  # （directory: redis のときだけ。memory は待たない）。部屋は migrateAfter を過ぎたら別の Pod へ引っ越す（再接続なし）。
  # 引っ越したあとも、直接繋いでいるクライアントはこの Pod が中継し続け、上限で切る。1 日続く部屋があるので 24h。
  # 形式は Go の duration のうち h・m・s の組み合わせ（例: 24h, 1h30m, 15s）。
  drainTimeout: 24h
  # draining のとき、作ってからこれだけ経った部屋を引っ越す。若い部屋は空になるか、この時間に達するまで待つ。
  migrateAfter: 3h
  # drainTimeout のこれだけ前に、直接繋いでいるクライアントへ server:notice（切る時刻）を送る。
  disconnectNotice: 10m
  # 空なら drainTimeout + 30 秒。drainTimeout より短くすると、引っ越しや中継の途中で Pod が強制終了される。
  terminationGracePeriodSeconds: ""
  # Go は GET /metrics（ポート realtime、認証なし、Ingress には出さない）で負荷を Prometheus 形式で出す（README の「自動スケール」）。
  metrics:
    # Prometheus Operator の ServiceMonitor を作る。CRD（monitoring.coreos.com）が無いクラスタでは有効にしない。
    serviceMonitor:
      enabled: false
      interval: 15s
      # Prometheus の serviceMonitorSelector に合わせるラベル（全件を拾う設定なら不要）
      labels: {}
  # KEDA の ScaledObject で Go の Pod を自動で増減する。KEDA の CRD と、指標を集める Prometheus が要る。
  # directory: redis でないと描画で失敗する。有効にすると Deployment の replicas は書かず、台数は HPA が持つ。
  # 有効にすると、Go が自分の Pod に pod-deletion-cost を書くための ServiceAccount・Role（pods の patch）・RoleBinding も作る。
  autoscaling:
    enabled: false
    # Role は namespace の pods 全部の patch を許す（Pod 名は起動ごとに変わり resourceNames で絞れない）。
    # ValidatingAdmissionPolicy で「instance の Pod の pod-deletion-cost の注釈だけ」に絞る。
    # Kubernetes 1.30 以上。無いクラスタでは false にする（Role だけになる）。
    deletionCostPolicy:
      enabled: true
    maxReplicaCount: 5
    pollingInterval: 30
    # 縮める速さ。消す Pod は pod-deletion-cost（直接の接続＋owner の部屋の参加者）の小さいものから選ばれ、
    # SIGTERM のあと部屋を引っ越して直接の接続が抜けるのを待つ（drainTimeout）。enabled: false なら縮めない。
    scaleDown:
      enabled: true
      stabilizationWindowSeconds: 900
      podsPerPeriod: 1
      periodSeconds: 600
    # 1 Pod に持たせたい接続数・部屋数・CPU。台数は trigger ごとの ceil(合計 / 閾値) の最大。
    # 接続数は websocket_connections の単位（中継は中継元と owner の両方で数える。2 Pod で利用者の約 1.5 倍）。
    # 負荷試験（#271。CPU 上限 1 コア、1 部屋 10 人・カーソル 20Hz・3 割が操作）で 1 Pod の指標が約 225 のとき
    # CPU 約 640m・遅延 p95 約 30ms、約 375 で遅延が急に悪化した。その手前で増やす。
    targetConnectionsPerPod: 200
    # targetRoomsPerPod は maxRooms 未満にする（上限で断り始める前に増やす）。
    targetRoomsPerPod: 800
    # 大人数の部屋は配信が人数の 2 乗で増え、接続数では負荷を測れないので CPU でも増やす（cAdvisor / metrics-server）。
    # 空なら CPU の trigger を作らない。resources.limits.cpu より小さくする。
    targetCPUPerPod: 600m
    prometheus:
      serverAddress: http://prometheus-operated.monitoring.svc:9090
      # 系列を選ぶ PromQL のラベル。空なら namespace と ServiceMonitor の service ラベル（<fullname>-instance）
      selector: ""
  # 未指定時はbackendと同じSecretを参照。専用Secretに切り替える場合は
  # existingSecretとsecretKeyを設定（32文字以上のランダム値）。
  existingSecret: ""
  secretKey: BETTER_AUTH_SECRET
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Go の Pod の配置。負荷試験の生成器と別のノードに置く（docs/operations/load-testing.md）などに使う。
  nodeSelector: {}
  affinity: {}
  tolerations: []
