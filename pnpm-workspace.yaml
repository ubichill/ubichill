packages:
  - 'packages/*'

# 複数パッケージで共有する依存のバージョンはここで一元管理する（各 package.json では `catalog:` で参照）
catalog:
  '@types/express': ^5.0.6
  '@types/lodash.throttle': ^4.1.9
  '@types/node': ^26.6.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  better-auth: ^1.7.6
  drizzle-orm: ^0.45.3
  esbuild: ^0.28.2
  express: ^5.2.1
  lodash.throttle: ^4.1.1
  nanoid: ^5.1.16
  nodemon: ^3.1.14
  react: ^19.3.0
  react-dom: ^19.3.0
  rimraf: ^6.1.3
  socket.io-client: ^4.8.3
  tsx: ^4.23.15
  typescript: ^7.0.2
  yaml: ^2.9.1
  zod: ^4.6.5

overrides:
  # 推移的依存も含めて単一バージョンに揃える
  esbuild: 'catalog:'
  react: 'catalog:'
  react-dom: 'catalog:'
  dts-bundle-generator>typescript: ^5.9.0

allowBuilds:
  esbuild: true
  sharp: true
